{% extends 'base.html' %}

{% block content %}

<div class="login-wrapper">
    <div class="left">
        <div class="overlay">
            <h1>Reset Password</h1>
            <p>Create a new strong password.</p>
        </div>
    </div>

    <div class="right">
        <div class="card">
            <h2>New Password 🔑</h2>
            <p>Please enter your new password</p>

            <form method="POST">
                <label>New Password</label>
                <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">

                <button type="submit">Update Password</button>
            </form>

        </div>
    </div>
</div>

<style>
    /* ================= LOGIN LAYOUT (Reused) ================= */
    .login-wrapper { display: flex; min-height: calc(100vh - var(--nav-height, 70px)); margin-top: 0; }
    .left { flex: 1; background: url('https://images.unsplash.com/photo-1555244162-803834f70033') center/cover; position: relative; }
    .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: center; padding: 40px; }
    .overlay h1 { font-size: 40px; }
    .overlay p { color: #ddd; }
    .right { flex: 1; display: flex; justify-content: center; align-items: center; background: #0f172a; }
    .card { width: 350px; padding: 30px; border-radius: 15px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); }
    label { font-size: 13px; color: #ccc; }
    input { width: 100%; padding: 10px; margin: 8px 0 15px; border-radius: 8px; border: none; background: rgba(255, 255, 255, 0.1); color: white; }
    button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, #f97316, #ef4444); color: white; cursor: pointer; }
    button:hover { transform: scale(1.05); }
    .text { text-align: center; margin-top: 15px; font-size: 13px; }
    .text a { color: #f97316; text-decoration: none; }
    @media (max-width: 768px) { .login-wrapper { flex-direction: column; } .left { height: 40vh; } }
</style>

{% endblock %}
