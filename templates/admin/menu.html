{% extends 'base.html' %}

{% block content %}
<section class="section-padding" style="margin-top: 50px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
        <div>
            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-link" style="color: var(--text-dim); text-decoration: none; font-size: 0.9rem;">&larr; Back to Dashboard</a>
            <h1 style="color: var(--primary); margin-top: 0.5rem;">Menu Management</h1>
        </div>
        <button onclick="openModal('addModal')" class="btn btn-primary">+ Add New Item</button>
    </div>

    <div class="glass card" style="padding: 2rem;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="text-align: left; border-bottom: 1px solid var(--glass-border); color: var(--primary);">
                    <th style="padding: 1rem;">Item</th>
                    <th style="padding: 1rem;">Category</th>
                    <th style="padding: 1rem;">Price</th>
                    <th style="padding: 1rem; text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 1rem;">
                        <strong>{{ item.name }}</strong>
                    </td>
                    <td style="padding: 1rem;">{{ item.category }}</td>
                    <td style="padding: 1rem;">₹{{ item.price|int }}</td>
                    <td style="padding: 1rem; text-align: right;">
                        <button onclick="openEditModal('{{ item.id }}', '{{ item.name|replace("'", "\\'")|replace('"', '&quot;') }}', '{{ item.category }}', '{{ item.price }}')" class="btn btn-outline" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Edit</button>
                        <a href="{{ url_for('delete_menu_item', item_id=item.id) }}" class="btn btn-outline admin-nav-link" style="padding: 0.3rem 0.8rem; font-size: 0.8rem; color: #ff5555; border-color: rgba(255,85,85,0.3);" data-confirm="Delete this item?">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>

<!-- Add Modal -->
<div id="addModal" class="modal-overlay" style="display: none;">
    <div class="glass card modal-content" style="max-width: 500px; padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem; color: var(--primary);">Add Menu Item</h3>
        <form action="{{ url_for('add_menu_item') }}" method="POST" class="dynamic-form">
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g. Garlic Bread">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category" class="form-control">
                    <option value="Starter">Starter</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Drink">Drink</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" class="form-control" required min="0">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Item</button>
                <button type="button" onclick="closeModal('addModal')" class="btn btn-outline" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" style="display: none;">
    <div class="glass card modal-content" style="max-width: 500px; padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem; color: var(--primary);">Edit Menu Item</h3>
        <form id="editForm" method="POST" class="dynamic-form">
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" name="name" id="edit_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category" id="edit_category" class="form-control">
                    <option value="Starter">Starter</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Drink">Drink</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" id="edit_price" class="form-control" required min="0">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update Item</button>
                <button type="button" onclick="closeModal('editModal')" class="btn btn-outline" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<style>
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.8); z-index: 2000; 
        display: flex; justify-content: center; align-items: center;
    }
    .modal-content { width: 90%; }
</style>

{% endblock %}

{% block scripts %}
<script>
function openModal(id) {
    document.getElementById(id).style.display = 'flex';
}
function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}
function openEditModal(id, name, category, price) {
    document.getElementById('edit_name').value = name;
    document.getElementById('edit_category').value = category;
    document.getElementById('edit_price').value = price;
    document.getElementById('editForm').action = '/admin/menu/edit/' + id;
    openModal('editModal');
}
</script>
{% endblock %}
