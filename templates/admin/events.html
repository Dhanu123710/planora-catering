{% extends 'base.html' %}

{% block content %}
<section class="section-padding" style="margin-top: 50px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
        <div>
            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-link" style="color: var(--text-dim); text-decoration: none; font-size: 0.9rem;">&larr; Back to Dashboard</a>
            <h1 style="color: var(--primary); margin-top: 0.5rem;">Event Management</h1>
        </div>
        <button onclick="openModal('addModal')" class="btn btn-primary">+ Add Event Type</button>
    </div>

    <div class="glass card" style="padding: 2rem; max-width: 800px; margin: 0 auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="text-align: left; border-bottom: 1px solid var(--glass-border); color: var(--primary);">
                    <th style="padding: 1rem;">Event Type</th>
                    <th style="padding: 1rem;">Base Price</th>
                    <th style="padding: 1rem; text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for event in events %}
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 1rem;">
                        <strong>{{ event.name }}</strong>
                    </td>
                    <td style="padding: 1rem;">₹{{ event.base_price|int }}</td>
                    <td style="padding: 1rem; text-align: right;">
                        <button onclick="openEditModal('{{ event.id }}', '{{ event.name|replace("'", "\\'") }}', '{{ event.base_price }}')" class="btn btn-outline" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">Edit</button>
                        <a href="{{ url_for('delete_event_type', event_id=event.id) }}" class="btn btn-outline admin-nav-link" style="padding: 0.3rem 0.8rem; font-size: 0.8rem; color: #ff5555; border-color: rgba(255,85,85,0.3);" data-confirm="Delete this event type?">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>

<!-- Add Modal -->
<div id="addModal" class="modal-overlay" style="display: none;">
    <div class="glass card modal-content" style="max-width: 400px; padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem; color: var(--primary);">Add Event Type</h3>
        <form action="{{ url_for('add_event_type') }}" method="POST" class="dynamic-form">
            <div class="form-group">
                <label>Event Name</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g. Corporate Meet">
            </div>
            <div class="form-group">
                <label>Base Price (₹)</label>
                <input type="number" name="base_price" class="form-control" required min="0" placeholder="Base cost per setup">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Event</button>
                <button type="button" onclick="closeModal('addModal')" class="btn btn-outline" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" style="display: none;">
    <div class="glass card modal-content" style="max-width: 400px; padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem; color: var(--primary);">Edit Event Type</h3>
        <form id="editForm" method="POST" class="dynamic-form">
            <div class="form-group">
                <label>Event Name</label>
                <input type="text" name="name" id="edit_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Base Price (₹)</label>
                <input type="number" name="base_price" id="edit_price" class="form-control" required min="0">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update Event</button>
                <button type="button" onclick="closeModal('editModal')" class="btn btn-outline" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<style>
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.8); z-index: 2000; 
        display: flex; justify-content: center; align-items: center;
    }
    .modal-content { width: 90%; }
</style>

{% endblock %}

{% block scripts %}
<script>
function openModal(id) {
    document.getElementById(id).style.display = 'flex';
}
function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}
function openEditModal(id, name, price) {
    document.getElementById('edit_name').value = name;
    document.getElementById('edit_price').value = price;
    document.getElementById('editForm').action = '/admin/event/edit/' + id;
    openModal('editModal');
}
</script>
{% endblock %}
